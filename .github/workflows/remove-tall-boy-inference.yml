name: One-time remove Tall Boy inference patch

on:
  push:
    paths:
      - .github/workflows/remove-tall-boy-inference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Catalog optional beer inference
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/src/routes/index.tsx'
          let text = fs.readFileSync(path, 'utf8')

          function replaceOnce(from, to) {
            if (!text.includes(from)) {
              throw new Error('Missing expected block:\n' + from)
            }
            text = text.replace(from, to)
          }

          replaceOnce(
            "                    Map non-standard Beer formats to Toast Optional Beer Category slots. Custom draft sizes and tall boy cans detected in the catalog are shown here; click Update to save them.",
            "                    Map non-standard Beer formats to Toast Optional Beer Category slots. Custom draft sizes detected in the catalog are shown here; click Update to save them.",
          )

          replaceOnce(
`  let shouldSuggestTallBoyCan =
    items.some(isTallBoyCanCatalogItem) &&
    !categories.some((category) => isTallBoyCanCategoryLabel(category.label))
`,
            '',
          )

          replaceOnce(
`    const hasTallBoyLabel = isTallBoyCanCategoryLabel(category.label)
    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)

    if (category.enabled || configuredDraftSize !== null || hasTallBoyLabel || hasCustomLabel) {
`,
`    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)

    if (category.enabled || configuredDraftSize !== null || hasCustomLabel) {
`,
          )

          replaceOnce(
`    if (shouldSuggestTallBoyCan) {
      shouldSuggestTallBoyCan = false
      return {
        ...category,
        enabled: true,
        label: 'Tall Boy Can',
      }
    }

`,
            '',
          )

          text = text.replace(
/\nfunction isTallBoyCanCatalogItem\(item: NormalizedMenuItem\) \{[\s\S]*?\n\}\n\nfunction parseOptionalBeerCategoryDraftSize/,
            '\nfunction parseOptionalBeerCategoryDraftSize',
          )

          text = text.replace(
/\nfunction isTallBoyCanCategoryLabel\(label: string\) \{[\s\S]*?\n\}\n\nfunction isDefaultOptionalBeerCategoryLabel/,
            '\nfunction isDefaultOptionalBeerCategoryLabel',
          )

          fs.writeFileSync(path, text)
          NODE
      - name: Commit source patch
        run: |
          rm -f .github/workflows/remove-tall-boy-inference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/index.tsx .github/workflows/remove-tall-boy-inference.yml
          git diff --cached --quiet && exit 0
          git commit -m "Infer only custom draft optional beer categories"
          git push
