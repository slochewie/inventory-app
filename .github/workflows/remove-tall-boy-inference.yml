name: Remove Tall Boy inference

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/src/routes/index.tsx'
          let text = fs.readFileSync(path, 'utf8')

          function mustReplace(from, to) {
            if (!text.includes(from)) {
              throw new Error('Missing block: ' + from.slice(0, 80))
            }
            text = text.replace(from, to)
          }

          mustReplace(
            '                    Map non-standard Beer formats to Toast Optional Beer Category slots. Custom draft sizes and tall boy cans detected in the catalog are shown here; click Update to save them.',
            '                    Map non-standard Beer formats to Toast Optional Beer Category slots. Custom draft sizes detected in the catalog are shown here; click Update to save them.',
          )

          mustReplace(
            `  let shouldSuggestTallBoyCan =\n    items.some(isTallBoyCanCatalogItem) &&\n    !categories.some((category) => isTallBoyCanCategoryLabel(category.label))\n`,
            '',
          )

          mustReplace(
            `    const hasTallBoyLabel = isTallBoyCanCategoryLabel(category.label)\n    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)\n\n    if (category.enabled || configuredDraftSize !== null || hasTallBoyLabel || hasCustomLabel) {\n`,
            `    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)\n\n    if (category.enabled || configuredDraftSize !== null || hasCustomLabel) {\n`,
          )

          mustReplace(
            `    if (shouldSuggestTallBoyCan) {\n      shouldSuggestTallBoyCan = false\n      return {\n        ...category,\n        enabled: true,\n        label: 'Tall Boy Can',\n      }\n    }\n\n`,
            '',
          )

          text = text.replace(/\nfunction isTallBoyCanCatalogItem\(item: NormalizedMenuItem\) \{[\s\S]*?\n\}\n\nfunction parseOptionalBeerCategoryDraftSize/, '\nfunction parseOptionalBeerCategoryDraftSize')
          text = text.replace(/\nfunction isTallBoyCanCategoryLabel\(label: string\) \{[\s\S]*?\n\}\n\nfunction isDefaultOptionalBeerCategoryLabel/, '\nfunction isDefaultOptionalBeerCategoryLabel')

          fs.writeFileSync(path, text)
          NODE
      - name: Commit source patch
        run: |
          rm -f .github/workflows/remove-tall-boy-inference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/index.tsx .github/workflows/remove-tall-boy-inference.yml
          git diff --cached --quiet && exit 0
          git commit -m "Infer only custom draft optional beer categories"
          git push
