name: One-time optional beer UI inference patch

on:
  push:
    paths:
      - .github/workflows/infer-catalog-optional-beer-categories.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Catalog optional beer category inference
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/src/routes/index.tsx'
          let text = fs.readFileSync(path, 'utf8')

          function block(lines) {
            return lines.join('\n') + '\n'
          }

          function replaceOnce(from, to) {
            if (!text.includes(from)) {
              throw new Error('Missing expected block:\n' + from)
            }
            text = text.replace(from, to)
          }

          replaceOnce(
            block([
              '      .then(([catalog, organizationConfig]) => {',
              '        setItems(catalog.items.map(catalogRowToNormalizedItem))',
              '        setSelectedGroupId(null)',
              '        setPage(1)',
            ]),
            block([
              '      .then(([catalog, organizationConfig]) => {',
              '        const catalogItems = catalog.items.map(catalogRowToNormalizedItem)',
              '        setItems(catalogItems)',
              '        setSelectedGroupId(null)',
              '        setPage(1)',
            ]),
          )

          replaceOnce(
            block([
              '        const nextOptionalBeerCategories = getOptionalBeerCategories(organizationConfig)',
              '        setOptionalBeerCategories(nextOptionalBeerCategories)',
              '        setOptionalBeerCategoryEdits(',
              '          nextOptionalBeerCategories.map((category) => ({ ...category })),',
              '        )',
              '        setVisibleOptionalBeerCategoryCount(',
              '          getVisibleOptionalBeerCategoryCount(nextOptionalBeerCategories),',
              '        )',
            ]),
            block([
              '        const nextOptionalBeerCategories = getOptionalBeerCategories(organizationConfig)',
              '        const effectiveOptionalBeerCategories = getEffectiveOptionalBeerCategoriesForCatalog(',
              '          nextOptionalBeerCategories,',
              '          catalogItems,',
              '        )',
              '        setOptionalBeerCategories(nextOptionalBeerCategories)',
              '        setOptionalBeerCategoryEdits(',
              '          effectiveOptionalBeerCategories.map((category) => ({ ...category })),',
              '        )',
              '        setVisibleOptionalBeerCategoryCount(',
              '          getVisibleOptionalBeerCategoryCount(effectiveOptionalBeerCategories),',
              '        )',
            ]),
          )

          replaceOnce(
            block([
              '                  <p>',
              "                    Map non-standard Beer formats to Toast Optional Beer Category slots. Use labels like Tall Boy Can for packaged cans or 10oz for custom draft sizes.",
              '                  </p>',
            ]),
            block([
              '                  <p>',
              "                    Map non-standard Beer formats to Toast Optional Beer Category slots. Custom draft sizes and tall boy cans detected in the catalog are shown here; click Update to save them.",
              '                  </p>',
            ]),
          )

          const helper = block([
            'function getEffectiveOptionalBeerCategoriesForCatalog(',
            '  savedCategories: readonly OptionalBeerCategoryConfig[],',
            '  items: readonly NormalizedMenuItem[],',
            '): OptionalBeerCategoryConfig[] {',
            '  const categories = savedCategories.map((category) => ({ ...category }))',
            '  const assignedDraftSizes = new Set(',
            '    categories.flatMap((category) => {',
            '      const draftSizeOz = parseOptionalBeerCategoryDraftSize(category.label)',
            '      return draftSizeOz === null ? [] : [draftSizeOz]',
            '    }),',
            '  )',
            '  const customDraftSizes = getCustomDraftSizesFromCatalog(items)',
            '    .filter((sizeOz) => !assignedDraftSizes.has(sizeOz))',
            '    .sort((left, right) => left - right)',
            '  let shouldSuggestTallBoyCan =',
            '    items.some(isTallBoyCanCatalogItem) &&',
            '    !categories.some((category) => isTallBoyCanCategoryLabel(category.label))',
            '  let nextCustomDraftSizeIndex = 0',
            '',
            '  return categories.map((category, index) => {',
            '    const configuredDraftSize = parseOptionalBeerCategoryDraftSize(category.label)',
            '    const hasTallBoyLabel = isTallBoyCanCategoryLabel(category.label)',
            '    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)',
            '',
            '    if (category.enabled || configuredDraftSize !== null || hasTallBoyLabel || hasCustomLabel) {',
            '      return category',
            '    }',
            '',
            '    if (shouldSuggestTallBoyCan) {',
            '      shouldSuggestTallBoyCan = false',
            '      return {',
            '        ...category,',
            '        enabled: true,',
            "        label: 'Tall Boy Can',",
            '      }',
            '    }',
            '',
            '    const customDraftSize = customDraftSizes[nextCustomDraftSizeIndex]',
            '    if (customDraftSize === undefined) return category',
            '',
            '    nextCustomDraftSizeIndex += 1',
            '    return {',
            '      ...category,',
            '      enabled: true,',
            '      label: formatOptionalBeerDraftSizeLabel(customDraftSize),',
            '    }',
            '  })',
            '}',
            '',
            'function getCustomDraftSizesFromCatalog(items: readonly NormalizedMenuItem[]) {',
            '  const sizes = new Set<number>()',
            '',
            '  items.forEach((item) => {',
            "    if (item.variantKind !== 'draft') return",
            '',
            "    const sizeOz = item.variantSizeOz ?? parseOptionalBeerCategoryDraftSize(item.variantLabel ?? '')",
            '    if (sizeOz !== null && ![8, 16, 24].includes(sizeOz)) {',
            '      sizes.add(sizeOz)',
            '    }',
            '  })',
            '',
            '  return [...sizes]',
            '}',
            '',
            'function isTallBoyCanCatalogItem(item: NormalizedMenuItem) {',
            "  const variantKind = item.variantKind?.toLowerCase() ?? ''",
            "  const packageType = item.variantPackageType?.toLowerCase() ?? ''",
            "  const variantLabel = item.variantLabel?.toLowerCase() ?? ''",
            '  const sizeOz = item.variantSizeOz ?? parseOptionalBeerCategoryDraftSize(variantLabel)',
            '',
            '  return (sizeOz === 24 || sizeOz === 25) &&',
            "    (variantKind !== 'draft') &&",
            "    (variantKind === 'can' ||",
            "      variantKind === 'package' ||",
            "      variantKind === 'packaged' ||",
            "      packageType === 'can' ||",
            '      /\\bcan\\b/.test(variantLabel))',
            '}',
            '',
            'function parseOptionalBeerCategoryDraftSize(label: string) {',
            '  const match = label.match(/\\b(\\d+(?:\\.\\d+)?)\\s*oz\\b/i) ??',
            '    label.match(/^\\s*(\\d+(?:\\.\\d+)?)\\s*$/)',
            '  if (!match) return null',
            '',
            '  const parsed = Number(match[1])',
            '  return Number.isFinite(parsed) && parsed > 0 ? parsed : null',
            '}',
            '',
            'function formatOptionalBeerDraftSizeLabel(sizeOz: number) {',
            '  return `${Number.isInteger(sizeOz) ? sizeOz.toString() : sizeOz.toFixed(1)}oz`',
            '}',
            '',
            'function isTallBoyCanCategoryLabel(label: string) {',
            '  return /\\btall\\s*boy\\s*can\\b/i.test(label) ||',
            '    /\\b2[45]\\s*oz\\s*can\\b/i.test(label)',
            '}',
            '',
            'function isDefaultOptionalBeerCategoryLabel(label: string, index: number) {',
            '  const normalized = label.trim().toLowerCase()',
            '  return !normalized ||',
            '    normalized === `optional beer category ${index + 1}`',
            '}',
            '',
          ])

          replaceOnce(
            block([
              'function getVisibleOptionalBeerCategoryCount(',
              '  categories: readonly OptionalBeerCategoryConfig[],',
              ') {',
            ]),
            helper + block([
              'function getVisibleOptionalBeerCategoryCount(',
              '  categories: readonly OptionalBeerCategoryConfig[],',
              ') {',
            ]),
          )

          fs.writeFileSync(path, text)
          NODE
      - name: Commit source patch
        run: |
          rm -f .github/workflows/infer-catalog-optional-beer-categories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/index.tsx .github/workflows/infer-catalog-optional-beer-categories.yml
          git diff --cached --quiet && exit 0
          git commit -m "Show inferred optional beer categories in Catalog"
          git push
# trigger valid workflow
