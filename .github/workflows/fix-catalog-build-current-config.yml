name: One-time Catalog config cleanup patch

on:
  push:
    paths:
      - .github/workflows/fix-catalog-build-current-config.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current organization config
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/src/routes/index.tsx'
          let text = fs.readFileSync(path, 'utf8')
          const pattern = /      draft8Enabled: draft8\.enabled,\n      draft8ActualSizeOz: parseDraftSize\(draft8\.actualSizeOz\),\n      draft16Enabled: draft16\.enabled,\n      draft16ActualSizeOz: parseDraftSize\(draft16\.actualSizeOz\),\n      draft24Enabled: draft24\.enabled,\n      draft24ActualSizeOz: parseDraftSize\(draft24\.actualSizeOz\),\n      pitcherEnabled: pitcher\.enabled,\n      pitcherActualSizeOz: parseDraftSize\(pitcher\.actualSizeOz\),\n/
          if (!pattern.test(text)) throw new Error('Missing stale draft config block')
          text = text.replace(pattern, '      ...buildFixedToastDraftSlotConfig(),\n')
          fs.writeFileSync(path, text)
          NODE
      - name: Commit source patch
        run: |
          rm -f .github/workflows/fix-catalog-build-current-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/index.tsx .github/workflows/fix-catalog-build-current-config.yml
          git diff --cached --quiet && exit 0
          git commit -m "Clean up Catalog fixed draft config"
          git push
