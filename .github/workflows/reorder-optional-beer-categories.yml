name: Optional beer category reorder patch

on:
  push:
    paths:
      - .github/workflows/reorder-optional-beer-categories.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replaceOnce(text, from, to) {
            if (!text.includes(from)) {
              throw new Error('Missing expected block:\n' + from)
            }
            return text.replace(from, to)
          }

          const workbookPath = 'app/src/features/menu-import/toast-template-workbook.ts'
          let workbook = fs.readFileSync(workbookPath, 'utf8')
          workbook = replaceOnce(
            workbook,
`  let shouldAutoAddTallBoyCan =
    beerRows.some((row) => row.can24ozPrice !== null) &&
    !configuredCategories.some((category) => isTallBoyCanCategory(category.label))
  let nextCustomDraftSizeIndex = 0
`,
`  let nextCustomDraftSizeIndex = 0
`,
          )
          workbook = replaceOnce(
            workbook,
`    const hasTallBoyCanLabel = isTallBoyCanCategory(category.label)
    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)

    if (category.enabled || hasConfiguredDraftSize || hasTallBoyCanLabel || hasCustomLabel) {
      return category
    }

    if (shouldAutoAddTallBoyCan) {
      shouldAutoAddTallBoyCan = false
      return {
        enabled: true,
        label: 'Tall Boy Can',
      }
    }

`,
`    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)

    if (category.enabled || hasConfiguredDraftSize || hasCustomLabel) {
      return category
    }

`,
          )
          fs.writeFileSync(workbookPath, workbook)

          const indexPath = 'app/src/routes/index.tsx'
          let index = fs.readFileSync(indexPath, 'utf8')
          index = replaceOnce(
            index,
`  function updateOptionalBeerCategoryDraft(
    slot: OptionalBeerCategoryConfig['slot'],
    patch: Partial<Pick<OptionalBeerCategoryConfig, 'enabled' | 'label'>>,
  ) {
    setOptionalBeerCategoryEdits((current) =>
      current.map((category) =>
        category.slot === slot ? { ...category, ...patch } : category,
      ),
    )
  }

`,
`  function updateOptionalBeerCategoryDraft(
    slot: OptionalBeerCategoryConfig['slot'],
    patch: Partial<Pick<OptionalBeerCategoryConfig, 'enabled' | 'label'>>,
  ) {
    setOptionalBeerCategoryEdits((current) =>
      current.map((category) =>
        category.slot === slot ? { ...category, ...patch } : category,
      ),
    )
  }

  function moveOptionalBeerCategoryDraft(
    slot: OptionalBeerCategoryConfig['slot'],
    direction: 'up' | 'down',
  ) {
    const offset = direction === 'up' ? -1 : 1

    setOptionalBeerCategoryEdits((current) => {
      const sourceIndex = current.findIndex((category) => category.slot === slot)
      const targetIndex = sourceIndex + offset

      if (
        sourceIndex < 0 ||
        targetIndex < 0 ||
        targetIndex >= visibleOptionalBeerCategoryCount
      ) {
        return current
      }

      const next = current.map((category) => ({ ...category }))
      const source = next[sourceIndex]
      const target = next[targetIndex]

      if (!source || !target) return current

      next[sourceIndex] = {
        ...source,
        enabled: target.enabled,
        label: target.label,
      }
      next[targetIndex] = {
        ...target,
        enabled: source.enabled,
        label: source.label,
      }

      return next
    })
  }

`,
          )
          index = replaceOnce(
            index,
`                  <p>
                    Map non-standard Beer formats to Toast Optional Beer Category slots. Custom draft sizes detected in the catalog are shown here; click Update to save them.
                  </p>
`,
`                  <p>
                    Map non-standard Beer formats to Toast optional slots. The order here controls which hidden workbook slot each category exports to; click Update to save changes.
                  </p>
`,
          )
          index = replaceOnce(
            index,
`                    {optionalBeerCategoryEdits
                      .slice(0, visibleOptionalBeerCategoryCount)
                      .map((category) => (
                        <div key={category.key} className="inventory-draft-slot-field">
                          <label className="inventory-inline-toggle">
                            <input
                              type="checkbox"
                              checked={category.enabled}
                              disabled={savingOptionalBeerCategories}
                              onChange={(event) =>
                                updateOptionalBeerCategoryDraft(category.slot, {
                                  enabled: event.target.checked,
                                })
                              }
                            />
                            <span>
                              Optional Beer Category {category.slot} ·{' '}
                              {category.enabled ? 'Enabled' : 'Disabled'}
                            </span>
                          </label>

                          <label className="inventory-search-control">
                            <span>Import/export mapping</span>
                            <input
                              type="text"
                              value={category.label}
                              disabled={!category.enabled || savingOptionalBeerCategories}
                              onChange={(event) =>
                                updateOptionalBeerCategoryDraft(category.slot, {
                                  label: event.target.value,
                                })
                              }
                              placeholder={\`Tall Boy Can, 10oz, or Optional Beer Category ${category.slot}\`}
                            />
                          </label>

                          {category.slot === visibleOptionalBeerCategoryCount ? (
                            <button
                              type="button"
                              className="inventory-secondary-button"
                              disabled={savingOptionalBeerCategories}
                              onClick={() => removeOptionalBeerCategory(category)}
                            >
                              Remove Optional Beer Category
                            </button>
                          ) : null}
                        </div>
                      ))}
`,
`                    {optionalBeerCategoryEdits
                      .slice(0, visibleOptionalBeerCategoryCount)
                      .map((category, index) => (
                        <div key={category.key} className="inventory-draft-slot-field">
                          <label className="inventory-inline-toggle">
                            <input
                              type="checkbox"
                              checked={category.enabled}
                              disabled={savingOptionalBeerCategories}
                              onChange={(event) =>
                                updateOptionalBeerCategoryDraft(category.slot, {
                                  enabled: event.target.checked,
                                })
                              }
                            />
                            <span>
                              {getBeerExportCategoryTitle(category)} ·{' '}
                              {category.enabled ? 'Enabled' : 'Disabled'}
                            </span>
                          </label>

                          <label className="inventory-search-control">
                            <span>Import/export mapping</span>
                            <input
                              type="text"
                              value={category.label}
                              disabled={!category.enabled || savingOptionalBeerCategories}
                              onChange={(event) =>
                                updateOptionalBeerCategoryDraft(category.slot, {
                                  label: event.target.value,
                                })
                              }
                              placeholder="Tall Boy Can, 10oz, or custom label"
                            />
                          </label>

                          <div className="inventory-draft-slots-actions">
                            <button
                              type="button"
                              className="inventory-secondary-button"
                              disabled={index === 0 || savingOptionalBeerCategories}
                              onClick={() => moveOptionalBeerCategoryDraft(category.slot, 'up')}
                            >
                              Move up
                            </button>
                            <button
                              type="button"
                              className="inventory-secondary-button"
                              disabled={
                                index >= visibleOptionalBeerCategoryCount - 1 ||
                                savingOptionalBeerCategories
                              }
                              onClick={() => moveOptionalBeerCategoryDraft(category.slot, 'down')}
                            >
                              Move down
                            </button>
                          </div>

                          {index === visibleOptionalBeerCategoryCount - 1 ? (
                            <button
                              type="button"
                              className="inventory-secondary-button"
                              disabled={savingOptionalBeerCategories}
                              onClick={() => removeOptionalBeerCategory(category)}
                            >
                              Remove category
                            </button>
                          ) : null}
                        </div>
                      ))}
`,
          )
          index = replaceOnce(index, `                    Add Optional Beer Category
`, `                    Add category
`)
          index = replaceOnce(index, `      setError(\`Set a label for Optional Beer Category ${missingLabel.slot}.\`)
`, `      setError('Set a label for the Beer export category.')
`)
          index = replaceOnce(index, `        \`Optional Beer Category ${disabledAssignedCategory.slot} is still assigned to catalog items. Reassign those items before disabling it.\`,
`, `        'This Beer export category is still assigned to catalog items. Reassign those items before disabling it.',
`)
          index = replaceOnce(
            index,
`function buildOptionalBeerCategoryConfig(
  categories: readonly OptionalBeerCategoryConfig[],
): Pick<
`,
`function getBeerExportCategoryTitle(category: OptionalBeerCategoryConfig) {
  return isDefaultOptionalBeerCategoryLabel(category.label, category.slot - 1)
    ? 'Beer export category'
    : category.label.trim()
}

function buildOptionalBeerCategoryConfig(
  categories: readonly OptionalBeerCategoryConfig[],
): Pick<
`,
          )
          fs.writeFileSync(indexPath, index)
          NODE
      - name: Commit source patch
        run: |
          rm -f .github/workflows/reorder-optional-beer-categories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/index.tsx app/src/features/menu-import/toast-template-workbook.ts .github/workflows/reorder-optional-beer-categories.yml
          git diff --cached --quiet && exit 0
          git commit -m "Allow ordering optional beer categories"
          git push
