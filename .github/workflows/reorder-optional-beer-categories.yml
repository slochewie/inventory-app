name: Optional beer category reorder patch

on:
  push:
    paths:
      - .github/workflows/reorder-optional-beer-categories.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          node <<'NODE'
          const fs = require('fs')

          function block(lines) {
            return lines.join('\n') + '\n'
          }

          function mustReplace(text, pattern, replacement, label) {
            const next = text.replace(pattern, replacement)
            if (next === text) throw new Error('Missing ' + label)
            return next
          }

          const workbookPath = 'app/src/features/menu-import/toast-template-workbook.ts'
          let workbook = fs.readFileSync(workbookPath, 'utf8')

          workbook = mustReplace(
            workbook,
            /  let shouldAutoAddTallBoyCan =\n    beerRows\.some\(\(row\) => row\.can24ozPrice !== null\) &&\n    !configuredCategories\.some\(\(category\) => isTallBoyCanCategory\(category\.label\)\)\n  let nextCustomDraftSizeIndex = 0\n/,
            '  let nextCustomDraftSizeIndex = 0\n',
            'Tall Boy auto-add flag',
          )

          workbook = mustReplace(
            workbook,
            /    const hasTallBoyCanLabel = isTallBoyCanCategory\(category\.label\)\n    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel\(category\.label, index\)\n\n    if \(category\.enabled \|\| hasConfiguredDraftSize \|\| hasTallBoyCanLabel \|\| hasCustomLabel\) \{\n      return category\n    \}\n\n    if \(shouldAutoAddTallBoyCan\) \{\n      shouldAutoAddTallBoyCan = false\n      return \{\n        enabled: true,\n        label: 'Tall Boy Can',\n      \}\n    \}\n\n/,
            block([
              '    const hasCustomLabel = !isDefaultOptionalBeerCategoryLabel(category.label, index)',
              '',
              '    if (category.enabled || hasConfiguredDraftSize || hasCustomLabel) {',
              '      return category',
              '    }',
              '',
            ]),
            'Tall Boy auto-add branch',
          )

          fs.writeFileSync(workbookPath, workbook)

          const indexPath = 'app/src/routes/index.tsx'
          let index = fs.readFileSync(indexPath, 'utf8')

          index = mustReplace(
            index,
            /  function updateOptionalBeerCategoryDraft\(\n    slot: OptionalBeerCategoryConfig\['slot'\],\n    patch: Partial<Pick<OptionalBeerCategoryConfig, 'enabled' \| 'label'>>,\n  \) \{\n    setOptionalBeerCategoryEdits\(\(current\) =>\n      current\.map\(\(category\) =>\n        category\.slot === slot \? \{ \.\.\.category, \.\.\.patch \} : category,\n      \),\n    \)\n  \}\n\n/,
            block([
              "  function updateOptionalBeerCategoryDraft(",
              "    slot: OptionalBeerCategoryConfig['slot'],",
              "    patch: Partial<Pick<OptionalBeerCategoryConfig, 'enabled' | 'label'>>,",
              "  ) {",
              "    setOptionalBeerCategoryEdits((current) =>",
              "      current.map((category) =>",
              "        category.slot === slot ? { ...category, ...patch } : category,",
              "      ),",
              "    )",
              "  }",
              "",
              "  function moveOptionalBeerCategoryDraft(",
              "    slot: OptionalBeerCategoryConfig['slot'],",
              "    direction: 'up' | 'down',",
              "  ) {",
              "    const offset = direction === 'up' ? -1 : 1",
              "",
              "    setOptionalBeerCategoryEdits((current) => {",
              "      const sourceIndex = current.findIndex((category) => category.slot === slot)",
              "      const targetIndex = sourceIndex + offset",
              "",
              "      if (sourceIndex < 0 || targetIndex < 0 || targetIndex >= visibleOptionalBeerCategoryCount) {",
              "        return current",
              "      }",
              "",
              "      const next = current.map((category) => ({ ...category }))",
              "      const source = next[sourceIndex]",
              "      const target = next[targetIndex]",
              "      if (!source || !target) return current",
              "",
              "      next[sourceIndex] = { ...source, enabled: target.enabled, label: target.label }",
              "      next[targetIndex] = { ...target, enabled: source.enabled, label: source.label }",
              "      return next",
              "    })",
              "  }",
              "",
            ]),
            'move optional category helper',
          )

          index = mustReplace(
            index,
            /Map non-standard Beer formats to Toast Optional Beer Category slots\. Custom draft sizes detected in the catalog are shown here; click Update to save them\./,
            'Map non-standard Beer formats to Toast optional slots. The order here controls which hidden workbook slot each category exports to; click Update to save changes.',
            'settings copy',
          )

          index = mustReplace(
            index,
            /\.slice\(0, visibleOptionalBeerCategoryCount\)\n                      \.map\(\(category\) => \(/,
            '.slice(0, visibleOptionalBeerCategoryCount)\n                      .map((category, index) => (',
            'optional category map index',
          )

          index = mustReplace(
            index,
            /                            <span>\n                              Optional Beer Category \{category\.slot\} ·\{' '\}\n                              \{category\.enabled \? 'Enabled' : 'Disabled'\}\n                            <\/span>/,
            block([
              '                            <span>',
              "                              {getBeerExportCategoryTitle(category)} ·{' '}",
              "                              {category.enabled ? 'Enabled' : 'Disabled'}",
              '                            </span>',
            ]).trimEnd(),
            'optional category label text',
          )

          index = mustReplace(
            index,
            /placeholder=\{`Tall Boy Can, 10oz, or Optional Beer Category \$\{category\.slot\}`\}/,
            'placeholder="Tall Boy Can, 10oz, or custom label"',
            'optional category placeholder',
          )

          index = mustReplace(
            index,
            /                          \{category\.slot === visibleOptionalBeerCategoryCount \? \(/,
            block([
              '                          <div className="inventory-draft-slots-actions">',
              '                            <button',
              '                              type="button"',
              '                              className="inventory-secondary-button"',
              '                              disabled={index === 0 || savingOptionalBeerCategories}',
              "                              onClick={() => moveOptionalBeerCategoryDraft(category.slot, 'up')}",
              '                            >',
              '                              Move up',
              '                            </button>',
              '                            <button',
              '                              type="button"',
              '                              className="inventory-secondary-button"',
              '                              disabled={',
              '                                index >= visibleOptionalBeerCategoryCount - 1 ||',
              '                                savingOptionalBeerCategories',
              '                              }',
              "                              onClick={() => moveOptionalBeerCategoryDraft(category.slot, 'down')}",
              '                            >',
              '                              Move down',
              '                            </button>',
              '                          </div>',
              '',
              '                          {index === visibleOptionalBeerCategoryCount - 1 ? (',
            ]).trimEnd(),
            'move controls',
          )

          index = mustReplace(index, /Remove Optional Beer Category/g, 'Remove category', 'remove label')
          index = mustReplace(index, /Add Optional Beer Category/g, 'Add category', 'add label')
          index = mustReplace(index, /Set a label for Optional Beer Category \$\{missingLabel\.slot\}\./, 'Set a label for the Beer export category.', 'missing label message')
          index = mustReplace(index, /Optional Beer Category \$\{disabledAssignedCategory\.slot\} is still assigned to catalog items\. Reassign those items before disabling it\./, 'This Beer export category is still assigned to catalog items. Reassign those items before disabling it.', 'disabled assigned message')

          index = mustReplace(
            index,
            /function buildOptionalBeerCategoryConfig\(\n  categories: readonly OptionalBeerCategoryConfig\[],\n\): Pick</,
            block([
              'function getBeerExportCategoryTitle(category: OptionalBeerCategoryConfig) {',
              "  return isDefaultOptionalBeerCategoryLabel(category.label, category.slot - 1)",
              "    ? 'Beer export category'",
              '    : category.label.trim()',
              '}',
              '',
              'function buildOptionalBeerCategoryConfig(',
              '  categories: readonly OptionalBeerCategoryConfig[],',
              '): Pick<',
            ]).trimEnd(),
            'category title helper',
          )

          fs.writeFileSync(indexPath, index)
          NODE
      - name: Commit source patch
        run: |
          rm -f .github/workflows/reorder-optional-beer-categories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/index.tsx app/src/features/menu-import/toast-template-workbook.ts .github/workflows/reorder-optional-beer-categories.yml
          git diff --cached --quiet && exit 0
          git commit -m "Allow ordering optional beer categories"
          git push
